name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish
        shell: bash
        run: |
          dotnet publish -c Release -o out
          dotnet publish -c Release --self-contained true \
            -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o out-sc
          mkdir dist
          cp out/Glance.exe dist/Glance.exe
          cp out-sc/Glance.exe dist/Glance-standalone.exe

      - uses: actions/upload-artifact@v4
        with:
          name: glance
          path: dist

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Glance $GITHUB_REF_NAME" --notes-file .github/release-notes.md
